<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="330" viewBox="0 0 1020 330" role="img" aria-labelledby="title description">
  <title id="title">Mirrored 96-well colour-gradient dispensing plan</title>
  <desc id="description">Rows B and C of a 96-well plate. Every well totals 250 microlitres. Row C is the physical mirror of row B.</desc>
  <rect width="1020" height="330" fill="#f8fafc"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Mirrored colour-gradient plate plan</text>
  <text x="40" y="70" font-family="Arial, sans-serif" font-size="14" fill="#475569">Rows B and C only · every well totals 250 µL · one fresh tip per source colour</text>
  <text x="40" y="126" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">B</text>
  <text x="40" y="216" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">C</text>
  <g font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#0f172a">
    <g stroke="#ffffff" stroke-width="2">
