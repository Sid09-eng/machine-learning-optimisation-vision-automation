      <rect x="80" y="182" width="70" height="52" rx="8" fill="#1d4ed8"/><rect x="152" y="182" width="70" height="52" rx="8" fill="#2563eb"/><rect x="224" y="182" width="70" height="52" rx="8" fill="#3b82f6"/><rect x="296" y="182" width="70" height="52" rx="8" fill="#38bdf8"/><rect x="368" y="182" width="70" height="52" rx="8" fill="#06b6d4"/><rect x="440" y="182" width="70" height="52" rx="8" fill="#14b8a6"/><rect x="512" y="182" width="70" height="52" rx="8" fill="#22c55e"/><rect x="584" y="182" width="70" height="52" rx="8" fill="#a3e635"/><rect x="656" y="182" width="70" height="52" rx="8" fill="#facc15"/><rect x="728" y="182" width="70" height="52" rx="8" fill="#f59e0b"/><rect x="800" y="182" width="70" height="52" rx="8" fill="#f97316"/><rect x="872" y="182" width="70" height="52" rx="8" fill="#ef4444"/>
