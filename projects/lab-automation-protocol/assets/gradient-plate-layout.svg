    <g fill="#0f172a">
      <text x="115" y="122">B1</text><text x="187" y="122">B2</text><text x="259" y="122">B3</text><text x="331" y="122">B4</text><text x="403" y="122">B5</text><text x="475" y="122">B6</text><text x="547" y="122">B7</text><text x="619" y="122">B8</text><text x="691" y="122">B9</text><text x="763" y="122">B10</text><text x="835" y="122">B11</text><text x="907" y="122">B12</text>
